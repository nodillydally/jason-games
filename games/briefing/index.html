<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#F6EFE2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Briefing — The News, Kept</title>
  <link rel="stylesheet" href="../../lib/theme.css">
  <script src="../../lib/theme.js"></script>
  <link rel="stylesheet" href="../../lib/sync.css">
  <link rel="stylesheet" href="../../lib/wardrobe.css">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📰</text></svg>">
</head>
<body>
<div id="app">

  <!-- ============================= Menu ============================= -->
  <section id="screen-menu" class="screen active">
    <a class="hub-link" href="../../">← All games</a>

    <header class="title">
      <h1>📰 Briefing</h1>
      <p>Recall yesterday cold. Keep today in writing. Get graded on both.</p>
    </header>

    <div class="card profile-card">
      <div class="level-badge">Lv&nbsp;<span id="menu-level">1</span></div>
      <div class="xp">
        <div class="xp-bar"><div id="xp-fill"></div></div>
        <span id="xp-label"></span>
      </div>
      <div class="profile-stats" id="profile-stats"></div>
      <button id="stats-btn" title="Your stats">📊 Stats</button>
    </div>

    <div class="card setup-card">
      <div id="setup-hint" class="setup-hint"></div>
      <button id="start-btn" class="primary big">Start today's session</button>
      <button id="dump-btn" class="ghost big">🎙 News dump — heard it elsewhere</button>
    </div>

    <div class="card sync-card">
      <div class="sync-row">
        <span id="sync-status" class="sync-status">☁ Cloud sync off</span>
        <button id="sync-btn" class="sync-btn">Set up</button>
      </div>
      <div id="sync-panel" class="sync-panel hidden">
        <p>Paste your sync code to save results to Atlas and track progress over
          time. Stored in this browser only — the game plays fine without it.</p>
        <div class="sync-form">
          <input id="sync-input" type="password" placeholder="Sync code" autocomplete="off" spellcheck="false">
          <button id="sync-save" class="primary">Save</button>
          <button id="sync-clear">Turn off</button>
        </div>
      </div>
    </div>
  </section>

  <!-- ============================== Day ============================== -->
  <section id="screen-day" class="screen">
    <div class="hud">
      <button id="day-quit" title="Back to menu">✕</button>
      <span id="day-meta"></span>
      <span class="hud-spacer"></span>
      <b id="day-score">0 pts</b>
    </div>

    <nav id="day-tabs" class="day-tabs"></nav>

    <div id="day-panel"></div>
  </section>

  <!-- ============================ Results ============================ -->
  <section id="screen-results" class="screen">
    <div class="card results-card">
      <h2 id="results-title"></h2>
      <div id="results-score"></div>
      <div id="results-stats" class="results-stats"></div>
      <div id="results-xp" class="results-xp"></div>
      <div id="results-note" class="results-note"></div>
      <div id="results-review"></div>
      <div class="results-actions">
        <button id="menu-btn" class="primary big">Menu</button>
      </div>
    </div>
  </section>

  <!-- ============================= Stats ============================= -->
  <section id="screen-stats" class="screen">
    <div class="card stats-card">
      <h2>Your news memory</h2>
      <div id="stats-summary" class="profile-stats"></div>
      <div id="stats-week"></div>
      <button id="stats-back" class="primary">Back</button>
    </div>
  </section>

</div>

<script src="../../lib/sync.js"></script>
<script src="../../lib/juice.js"></script>
<script src="../../lib/avatar.js"></script>
<script src="../../lib/wardrobe.js"></script>
<script src="../../lib/next.js"></script>
<script src="game.js"></script>
</body>
</html>
