<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Numbers — Mental Math Practice</title>
  <link rel="stylesheet" href="../../lib/sync.css">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔢</text></svg>">
</head>
<body>
<div id="app">

  <!-- ============================= Menu ============================= -->
  <section id="screen-menu" class="screen active">
    <header class="title">
      <h1>🔢 Numbers</h1>
      <p>Mental math under pressure. No scratch paper.</p>
    </header>

    <div class="card profile-card">
      <div class="level-badge">Lv&nbsp;<span id="menu-level">1</span></div>
      <div class="xp">
        <div class="xp-bar"><div id="xp-fill"></div></div>
        <span id="xp-label"></span>
      </div>
      <div class="profile-stats" id="profile-stats"></div>
      <button id="stats-btn" title="Your stats">📊 Stats</button>
    </div>

    <div class="card setup-card">
      <h2>Mode</h2>
      <div class="opt-grid" id="mode-options"></div>

      <h2>Topic</h2>
      <div class="opt-grid" id="topic-options"></div>

      <h2>Difficulty</h2>
      <div class="opt-grid" id="difficulty-options"></div>

      <div id="setup-hint" class="setup-hint"></div>
      <button id="start-btn" class="primary big">Start</button>
    </div>

    <div class="card sync-card">
      <div class="sync-row">
        <span id="sync-status" class="sync-status">☁ Cloud sync off</span>
        <button id="sync-btn" class="sync-btn">Set up</button>
      </div>
      <div id="sync-panel" class="sync-panel hidden">
        <p>Paste your sync code to save results to Atlas and track progress over
          time. Stored in this browser only — the game plays fine without it.</p>
        <div class="sync-form">
          <input id="sync-input" type="password" placeholder="Sync code" autocomplete="off" spellcheck="false">
          <button id="sync-save" class="primary">Save</button>
          <button id="sync-clear">Turn off</button>
        </div>
      </div>
    </div>
  </section>

  <!-- ============================= Game ============================= -->
  <section id="screen-game" class="screen">
    <div class="hud">
      <button id="quit-btn" title="Back to menu">✕</button>
      <span id="hud-progress"></span>
      <span id="hud-clock" class="hidden"></span>
      <span class="hud-spacer"></span>
      <span id="hud-lives" class="hidden"></span>
      <span id="hud-streak"></span>
      <b id="hud-score">0 pts</b>
    </div>

    <div class="timer-track"><div id="timer-fill"></div></div>

    <div class="card question-card">
      <div id="topic-tag" class="topic-tag"></div>
      <div id="question"></div>
      <div id="choices"></div>
      <form id="type-form" class="hidden" autocomplete="off">
        <input id="type-input" type="text" inputmode="numeric" placeholder="Your answer…" spellcheck="false">
        <button type="submit" class="primary">Check</button>
      </form>
      <div id="feedback"></div>
      <button id="next-btn" class="primary hidden">Next</button>
    </div>
  </section>

  <!-- ============================ Results ============================ -->
  <section id="screen-results" class="screen">
    <div class="card results-card">
      <h2 id="results-title"></h2>
      <div id="results-score"></div>
      <div id="results-stats" class="results-stats"></div>
      <div id="results-xp" class="results-xp"></div>
      <div id="results-missed"></div>
      <div class="results-actions">
        <button id="again-btn" class="primary big">Play again</button>
        <button id="menu-btn">Menu</button>
      </div>
    </div>
  </section>

  <!-- ============================= Stats ============================= -->
  <section id="screen-stats" class="screen">
    <div class="card stats-card">
      <h2>Your numbers</h2>
      <div id="stats-summary" class="profile-stats"></div>
      <div id="stats-topics"></div>
      <div id="stats-weakest"></div>
      <button id="stats-back" class="primary">Back</button>
    </div>
  </section>

</div>

<script src="../../lib/sync.js"></script>
<script src="questions.js"></script>
<script src="game.js"></script>
</body>
</html>
